services:

  gateway:
    container_name: gateway-prod
    build:
      context: ./gateway/
    env_file: ./env/gateway.env
    depends_on:
    - zipkin
    - keycloak
    - discovery-server
    ports:
    - "8080:8080"
    networks: 
    - picshare-internal
    - frontend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
        reservations:
          memory: 256M
          cpus: '0.50'

  discovery-server:
    container_name: discovery-server
    build: 
      context: ./services/discovery-server/
    networks: 
    - picshare-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'

  keycloak:
    container_name: keycloak
    build:
      context: ./services/keycloak/
    env_file: ./env/keycloak.env
    command: start-dev
    ports:
    - "8090:8080"
    - "8443:8443"
    depends_on:
      user-service:
        condition: service_started
      keycloak-db:
        condition: service_healthy
    networks:
    - picshare-internal
    - keycloak-network
    - frontend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
        reservations:
          memory: 256M
          cpus: '0.50'

  keycloak-db:
    image: postgres:latest
    container_name: keycloak-db
    env_file: ./env/keycloak.env
    volumes:
    - keycloak-service-data:/var/lib/postgresql
    expose:
    - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - keycloak-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.25'

  user-service:
    container_name: user-prod
    build:
      context: ./services/user-service/
    env_file: ./env/user.env
    depends_on:
    - zipkin
    - user-db
    - discovery-server
    networks: 
    - user-network
    - picshare-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
        reservations:
          memory: 256M
          cpus: '0.50'

  user-db:
    image: postgres:latest
    container_name: user-db
    env_file: ./env/user.env
    volumes: 
    - user-service-data:/var/lib/postgresql
    expose:
    - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - user-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.25'

  feed-service:
    container_name: feed-prod
    build:
      context: ./services/feed-service/
    env_file: ./env/feed.env
    depends_on:
    - discovery-server
    - feed-db
    networks: 
    - feed-network
    - picshare-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
        reservations:
          memory: 256M
          cpus: '0.50'

  feed-db:
    image: postgres:latest
    container_name: feed-db
    env_file: ./env/feed.env
    volumes: 
    - feed-service-data:/var/lib/postgresql
    expose:
    - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - feed-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.25'

  post-service:
    container_name: post-prod
    build:
      context: ./services/post-service/
    env_file: ./env/post.env
    depends_on:
    - discovery-server
    - post-db
    networks: 
    - post-network
    - picshare-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
        reservations:
          memory: 256M
          cpus: '0.50'

  post-db:
    image: postgres:latest
    container_name: post-db
    env_file: ./env/post.env
    volumes: 
    - post-service-data:/var/lib/postgresql
    expose:
    - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - post-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.25'

  storage-service:
    container_name: storage-prod
    build:
      context: ./services/storage-service/
    environment:
      - _JAVA_OPTIONS=-XX:MaxRAMPercentage='70.0'
    depends_on:
    - discovery-server
    - minio
    networks: 
    - storage-network
    - picshare-internal
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.50'
        reservations:
          memory: 700M
          cpus: '0.50'

  minio:
    image: minio/minio
    container_name: minio
    env_file: ./env/minio.env
    ports:
    - "9001:9001"
    - "9000:9000"
    expose:
    - "9000"
    command: server /data --console-address ":9001"
    networks:
    - storage-network
    volumes:
    - minio-data:/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.25'

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
    - 9411:9411
    networks:
    - picshare-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
        reservations:
          memory: 256M
          cpus: '0.50'

  broker:
    image: apache/kafka:4.2.0
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: |
        CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: |
        PLAINTEXT://broker:29092,PLAINTEXT_HOST://broker:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: |
        PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qj'
    ports:
    - 9092:9092
    - 9101:9101
    networks:
    - picshare-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
        reservations:
          memory: 512M
          cpus: '0.50'

volumes:
  keycloak-service-data:
    external: true
    name: picshare_keycloak-service-data
  user-service-data:
    external: true
    name: picshare_user-service-data
  post-service-data:
    external: true
    name: picshare_post-service-data
  feed-service-data:
    external: true
    name: picshare_feed-service-data
  minio-data:
    external: true
    name: picshare_minio-data

networks:
  user-network:
  post-network:
  keycloak-network:
  feed-network:
  storage-network:
  picshare-internal:
  frontend:
    name: frontend
