services:

  angular:
    container_name: angular-dev
    build:
      context: ./picshare-frontend/
      dockerfile: Dockerfile.dev
    ports:
    - "4200:4200"
    networks:
    - frontend

  gateway:
    container_name: gateway-prod
    build:
      context: ./gateway/
    env_file: ./env/gateway.env
    depends_on:
    - zipkin
    - keycloak
    - discovery-server
    ports:
    - "8080:8080"
    networks: 
    - picshare-internal
    - frontend

  discovery-server:
    build: 
      context: ./services/discovery-server/
    networks: 
    - picshare-internal

  keycloak:
    build:
      context: ./services/keycloak/
    env_file: ./env/keycloak.env
    command: start-dev
    ports:
    - "8090:8080"
    - "8443:8443"
    depends_on:
      user-service:
        condition: service_started
      keycloak-db:
        condition: service_healthy
    networks:
    - picshare-internal
    - keycloak-network
    - frontend

  keycloak-db:
    image: postgres:latest
    env_file: ./env/keycloak.env
    volumes:
    - keycloak-service-data:/var/lib/postgresql
    expose:
    - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - keycloak-network

  user-service:
    container_name: user-prod
    build:
      context: ./services/user-service/
    env_file: ./env/user.env
    depends_on:
    - zipkin
    - user-db
    - discovery-server
    networks: 
    - user-network
    - picshare-internal

  user-db:
    image: postgres:latest
    env_file: ./env/user.env
    volumes: 
    - user-service-data:/var/lib/postgresql
    expose:
    - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - user-network

  feed-service:
    container_name: feed-prod
    build:
      context: ./services/feed-service/
    env_file: ./env/feed.env
    depends_on:
    - discovery-server
    - feed-db
    networks: 
    - feed-network
    - picshare-internal

  feed-db:
    image: postgres:latest
    env_file: ./env/feed.env
    volumes: 
    - feed-service-data:/var/lib/postgresql
    expose:
    - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - feed-network
        

  post-service:
    container_name: post-prod
    build:
      context: ./services/post-service/
    env_file: ./env/post.env
    depends_on:
    - discovery-server
    - post-db
    networks: 
    - post-network
    - picshare-internal

  post-db:
    image: postgres:latest
    env_file: ./env/post.env
    volumes: 
    - post-service-data:/var/lib/postgresql
    expose:
    - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - post-network

  storage-service:
    container_name: storage-prod
    build:
      context: ./services/storage-service/
    depends_on:
    - discovery-server
    - minio
    networks: 
    - storage-network
    - picshare-internal

  minio:
    image: minio/minio
    container_name: minio
    env_file: ./env/minio.env
    ports:
    - "9001:9001"
    - "9000:9000"
    expose:
    - "9000"
    command: server /data --console-address ":9001"
    networks:
    - storage-network
    volumes:
    - minio-data:/data

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
    - 9411:9411
    networks:
    - picshare-internal

volumes:
  keycloak-service-data:
  user-service-data:
  post-service-data:
  feed-service-data:
  minio-data:

networks:
  user-network:
  post-network:
  keycloak-network:
  feed-network:
  storage-network:
  picshare-internal:
  frontend:
