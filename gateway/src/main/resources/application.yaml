gateway-uri: http://localhost:8080
ui-uri: http://angular:4200
storage-service-uri: http://storage-service:8080
user-service-uri: http://user-service:8080
feed-service-uri: http://feed-service:8080
post-service-uri: http://post-service:8080
discovery-server-uri: http://discovery-server:8761


spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
          default-filters:
          - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          routes:


          # Redirection from / to /ui/
          - id: home
            uri: ${gateway-uri}
            predicates:
            - Path=/
            filters:
            - RedirectTo=301,${gateway-uri}/ui/

          - id: ui-silent-sso
            uri: ${ui-uri}
            predicates:
            - Path=/ui/silent-check-sso.html
            filters:
            - AddResponseHeader=X-Frame-Options,SAMEORIGIN
          
          # Serve a SPA through the gateway (requires it to have a baseHref set as /ui)
          - id: ui-regular
            uri: ${ui-uri}
            predicates:
            - Path=/ui/**
                
          - id: user-service
            uri: lb://user-service
            predicates:
            - Path=/api/user/**
            filters:
            - StripPrefix=1

          - id: feed-service
            uri: lb://feed-service
            predicates:
            - Path=/api/feed/**
            filters:
            - StripPrefix=1

          - id: post-service
            uri: lb://post-service
            predicates:
            - Path=/api/post/**
            filters:
            - StripPrefix=1

          - id: storage-service
            uri: lb://storage-service
            predicates:
            - Path=/media/**
            filters:

  application:
    name: Gateway

  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
      additional-paths: src/main/resources
    livereload: 
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/picshare-realm
          jwk-set-uri: http://keycloak:8080/realms/picshare-realm/protocol/openid-connect/certs
          
server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${discovery-server-uri}
  instance:
    prefer-ip-address: true
  managaement:
    endpoints:
      web:
        exposure:
          include: "*"

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.http.server.reactive: INFO
    org.springframework.web.reactive: INFO
    org.springframework.boot.autoconfigure.web: INFO
    reactor.netty: INFO
    redisrateLimiter: INFO
