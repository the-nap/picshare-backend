spring:
  application:
    name: Storage Service

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
      additional-paths: src/main/resources
    livereload: 
      enabled: true

minio:
  url: http://minio:9000
  access:
    name: minioadmin
    secret: minioadmin
  bucket:
    name: data
    
