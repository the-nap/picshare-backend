spring:
  application:
    name: storage-service

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  cloud:
    function:
      definition: postDeleted, userDeleted
    stream:
      bindings:
        postDeleted-in-0:
          destination: post_deleted_topic
        userDeleted-in-0:
          destination: user_deleted_topic
        postSavedSuccess-out-0:
          destination: post_saved_success_topic

  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
      additional-paths: src/main/resources
    livereload: 
      enabled: true

minio:
  url: http://minio:9000
  access:
    name: minioadmin
    secret: minioadmin
  bucket:
    name: data

server:
  port: 8080
    
eureka:
  client.service_url.defaultZone: http://discovery-server:8761/eureka
  instance:
    secure-port-enabled: false
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

info:
  app:
    name: ${spring.application.name}
    version: 0.0.1
    environment: dev

management:
  endpoints:
    web:
      exposure:
        include: 
        - health
        - info
        - metrics

  endpoint:
    health:
      show-details: always

  tracing:
    sampling.probability: 1
    enabled: true
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans
logging:
  level:
    org.springframework.web: DEBUG
