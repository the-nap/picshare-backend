spring:
  application:
    name: discovery-server

server:
  port: 8761

eureka:
  instance.hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url.defaultzone: http://${eureka.instance.hostname}:${server.port}/eureka

logging:
  level:
    com:
      netflix:
        eureka: OFF
        discovery: OFF
