spring:
  application:
    name: Post Service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/picshare-realm
          jwk-set-uri: http://keycloak:8080/realms/picshare-realm/protocol/openid-connect/certs

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
      additional-paths: src/main/resources
    livereload: 
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop

logging.level.org.springframework.security: DEBUG
