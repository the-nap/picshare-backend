spring:
  application:
    name: User Service

  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
      additional-paths: src/main/resources
    livereload: 
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    org.springframework.web: DEBUG
