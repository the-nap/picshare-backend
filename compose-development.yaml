services:

  angular:
    container_name: angular-dev
    build:
      context: ./picshare-frontend/
      dockerfile: Dockerfile.dev
    ports:
    - "4200:4200"
    networks:
    - frontend
    develop:
      watch:
      - action: sync
        path: ./picshare-frontend/src
        target: /app/src
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.50'
          pids: 512

  gateway:
    container_name: gateway-dev
    build:
      context: .
      dockerfile: gateway/Dockerfile.dev
    env_file: ./env/gateway.env
    depends_on:
    - zipkin
    - keycloak
    - discovery-server
    ports:
    - "8080:8080"
    - "5005:5005"
    - "35729:35729"
    environment:
    - SPRING_PROFILES_ACTIVE=dev
    develop:
      watch:
      - action: sync
        path: ./gateway/src
        target: /app/src
      - action: sync
        path: ./gateway/pom.xml
        target: /app/pom.xml
    networks: 
    - picshare-internal
    - frontend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
          pids: 512

  discovery-server:
    container_name: discovery-dev
    build: 
      context: .
      dockerfile: services/discovery-server/Dockerfile.dev
    ports:
    - "5010:5005"
    - "35735:35729"
    - "8761:8761"
    environment:
    - SPRING_PROFILES_ACTIVE=dev
    develop:
      watch:
      - action: sync
        path: ./services/discovery-server/src
        target: /app/src
      - action: sync
        path: ./services/discovery-server/pom.xml
        target: /app/pom.xml
    networks: 
    - user-network
    - picshare-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
          pids: 512

  keycloak:
    build:
      context: ./services/keycloak/
    env_file: ./env/keycloak.env
    command: start-dev
    ports:
    - "8090:8080"
    - "8443:8443"
    depends_on:
      user-service:
        condition: service_started
      keycloak-db:
        condition: service_healthy
    networks:
    - picshare-internal
    - keycloak-network
    - frontend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
          pids: 512

  keycloak-db:
    container_name: keycloak-db
    image: postgres:latest
    env_file: ./env/keycloak.env
    volumes:
    - keycloak-service-data:/var/lib/postgresql
    expose:
    - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - keycloak-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
          pids: 512

  user-service:
    container_name: user-dev
    build:
      context: .
      dockerfile: services/user-service/Dockerfile.dev
    env_file: ./env/user.env
    depends_on:
      zipkin:
        condition: service_started
      user-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      broker: 
        condition: service_started
    ports:
    - "5006:5005"
    - "35730:35729"
    environment:
    - SPRING_PROFILES_ACTIVE=dev
    develop:
      watch:
      - action: sync
        path: ./services/user-service/src
        target: /app/src
      - action: sync
        path: ./services/user-service/pom.xml
        target: /app/pom.xml
    networks: 
    - user-network
    - picshare-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
          pids: 512

  user-db:
    image: postgres:latest
    container_name: user-db
    env_file: ./env/user.env
    volumes: 
    - user-service-data:/var/lib/postgresql
    expose:
    - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - user-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
          pids: 512

  feed-service:
    container_name: feed-dev
    build:
      context: .
      dockerfile: services/feed-service/Dockerfile.dev
    env_file: ./env/feed.env
    depends_on:
      zipkin:
        condition: service_started
      feed-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      broker: 
        condition: service_started
    ports:
    - "5007:5005"
    - "35731:35729"
    environment:
    - SPRING_PROFILES_ACTIVE=dev
    develop:
      watch:
      - action: sync
        path: ./services/feed-service/src
        target: /app/src
      - action: sync
        path: ./services/feed-service/pom.xml
        target: /app/pom.xml
    networks: 
    - feed-network
    - picshare-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
          pids: 512

  feed-db:
    image: postgres:latest
    container_name: feed-db
    env_file: ./env/feed.env
    volumes: 
    - feed-service-data:/var/lib/postgresql
    expose:
    - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - feed-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
          pids: 512

  post-service:
    container_name: post-dev
    build:
      context: .
      dockerfile: services/post-service/Dockerfile.dev
    env_file: ./env/post.env
    depends_on:
      zipkin:
        condition: service_started
      post-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      broker: 
        condition: service_started
    ports:
    - "5008:5005"
    - "35733:35729"
    environment:
    - SPRING_PROFILES_ACTIVE=dev
    develop:
      watch:
      - action: sync
        path: ./services/post-service/src
        target: /app/src
      - action: sync
        path: ./services/post-service/pom.xml
        target: /app/pom.xml
    networks: 
    - post-network
    - picshare-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
          pids: 512

  post-db:
    image: postgres:latest
    container_name: post-db
    env_file: ./env/post.env
    volumes: 
    - post-service-data:/var/lib/postgresql
    expose:
    - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - post-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
          pids: 512

  storage-service:
    container_name: storage-dev
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile.dev
    depends_on:
      zipkin:
        condition: service_started
      minio:
        condition: service_started
      discovery-server:
        condition: service_started
      broker: 
        condition: service_started
    ports:
    - "5009:5005"
    - "35734:35729"
    environment:
    - SPRING_PROFILES_ACTIVE=dev
    develop:
      watch:
      - action: sync
        path: ./services/storage-service/src
        target: /app/src
      - action: sync
        path: ./services/storage-service/pom.xml
        target: /app/pom.xml
    networks: 
    - storage-network
    - picshare-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
          pids: 512

  minio:
    image: minio/minio
    container_name: minio
    env_file: ./env/minio.env
    ports:
    - "9001:9001"
    - "9000:9000"
    expose:
    - "9000"
    command: server /data --console-address ":9001"
    networks:
    - storage-network
    volumes:
    - minio-data:/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '1.00'
          pids: 512

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    # Environment settings are defined here https://github.com/openzipkin/zipkin/blob/master/zipkin-server/README.md#environment-variables
    ports:
    - 9411:9411
    networks:
    - picshare-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
          pids: 512

  broker:
    image: apache/kafka:4.2.0
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: |
        CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: |
        PLAINTEXT://broker:29092,PLAINTEXT_HOST://broker:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: |
        PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qj'
    ports:
    - 9092:9092
    - 9101:9101
    networks:
    - picshare-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
          pids: 512
      

volumes:
  keycloak-service-data:
  user-service-data:
  post-service-data:
  feed-service-data:
  minio-data:

networks:
  user-network:
  post-network:
  keycloak-network:
  feed-network:
  storage-network:
  picshare-internal:
  frontend:
