services:

  angular:
    build:
      context: ./picshare-frontend/
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    networks:
      - frontend
    develop:
      watch:
        - action: sync
          path: ./picshare-frontend/src
          target: /app/src

  keycloak:
    build:
      context: ./services/keycloak/
    env_file: ./env/keycloak.env
    command:
      start-dev
    ports:
      - "8090:8080"
      - "8443:8443"
    depends_on:
      user-service:
        condition: service_started
      keycloak-db:
        condition: service_healthy
    networks:
      - picshare_internal
      - frontend

  gateway:
    container_name: gateway-container-dev
    image: gateway-image
    build:
      context: ./gateway/
      dockerfile: Dockerfile.dev
    env_file: ./env/gateway.env
    depends_on:
      - keycloak
    ports:
      - "8080:8080"
      - "5005:5005"
      - "35729:35729"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    develop:
      watch:
        - action: sync
          path: ./gateway/src
          target: /app/src
        - action: sync+restart
          path: ./gateway/pom.xml
          target: /app/pom.xml
    networks: 
      - picshare_internal
      - frontend

  keycloak-db:
    image: postgres:latest
    env_file: ./env/keycloak.env
    volumes:
      - keycloak-service-data:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
        - picshare_internal

  user-service:
    container_name: user-container-dev
    build:
      context: ./services/user-service/
      dockerfile: Dockerfile.dev
    env_file: ./env/user.env
    depends_on:
      - user-db
    ports:
      - "5006:5005"
      - "35730:35729"
    volumes:
      - ~/.m2:/root/.m2:delegated
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    develop:
      watch:
        - action: sync
          path: ./services/user-service/src
          target: /app/src
        - action: sync+restart
          path: ./services/user-service/pom.xml
          target: /app/pom.xml
    networks: 
      - picshare_internal

  user-db:
    image: postgres:latest
    env_file: ./env/user.env
    volumes: 
    - user-service-data:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
        - picshare_internal

volumes:
  keycloak-service-data:
  user-service-data:

networks:
  picshare_internal:
    driver: bridge
  frontend:
    driver: bridge
